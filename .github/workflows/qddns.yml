name: Build qddns (IPK + APK)

# 触发方式：
#   1. 手动触发 (workflow_dispatch)，可选自定义目标架构
#   2. push 到 main / master
#   3. 每周一北京时间上午 10:30 自动构建
#
# 说明：
#   - 本仓库不需要 fork 上游源码，直接通过 OpenWrt feeds 引用
#     https://github.com/qimaoww/luci-app-qddns.git
#   - IPK 走 OpenWrt 23.05 SDK（旧包格式）
#   - APK 走 OpenWrt SNAPSHOT SDK（新包格式，24.10+ 默认）
#   - 使用官方 openwrt/sdk Docker 镜像，免本地搭建编译环境

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated targets, e.g. "armvirt-64 x86-64"'
        required: false
        default: 'armvirt-64'
      ipk_sdk_tag:
        description: 'OpenWrt SDK tag for IPK build'
        required: false
        default: '23.05.5'
      apk_sdk_tag:
        description: 'OpenWrt SDK tag for APK build (snapshot/24.10.x)'
        required: false
        default: 'snapshot'
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * 1'

env:
  # 上游源码仓库（不 fork，仅引用）
  QDDNS_FEED_URL: https://github.com/qimaoww/luci-app-qddns.git
  QDDNS_FEED_BRANCH: main

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
      ipk_sdk_tag: ${{ steps.set.outputs.ipk_sdk_tag }}
      apk_sdk_tag: ${{ steps.set.outputs.apk_sdk_tag }}
    steps:
      - id: set
        run: |
          INPUT="${{ github.event.inputs.targets || 'armvirt-64' }}"
          TARGETS=$(echo "$INPUT" | tr ' ' '\n' | jq -R . | jq -sc .)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "ipk_sdk_tag=${{ github.event.inputs.ipk_sdk_tag || '23.05.5' }}" >> "$GITHUB_OUTPUT"
          echo "apk_sdk_tag=${{ github.event.inputs.apk_sdk_tag || 'snapshot' }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.format }} / ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
        format: [ipk, apk]
        include:
          - format: ipk
            sdk_tag_from: ipk_sdk_tag
          - format: apk
            sdk_tag_from: apk_sdk_tag
    steps:
      - name: Resolve SDK tag
        id: tag
        run: |
          case "${{ matrix.sdk_tag_from }}" in
            ipk_sdk_tag)  echo "tag=${{ needs.prepare.outputs.ipk_sdk_tag }}" >> "$GITHUB_OUTPUT" ;;
            apk_sdk_tag)  echo "tag=${{ needs.prepare.outputs.apk_sdk_tag }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Prepare output / cache directories
        run: |
          mkdir -p output cargo-cache dl-cache
          chmod -R 777 output cargo-cache dl-cache

      - name: Build with OpenWrt SDK
        run: |
          docker run --rm \
            -v "$PWD/output:/output" \
            -v "$PWD/cargo-cache:/home/build/.cargo" \
            -v "$PWD/dl-cache:/home/build/openwrt/dl" \
            -e FEED_URL="${QDDNS_FEED_URL}" \
            -e FEED_BRANCH="${QDDNS_FEED_BRANCH}" \
            openwrt/sdk:${{ matrix.target }}-${{ steps.tag.outputs.tag }} \
            bash -c '
              set -ex
              cd /home/build/openwrt

              # 1. 更新并安装默认 feeds（luci-base / packages/lang/rust 等）
              ./scripts/feeds update -a
              ./scripts/feeds install -a

              # 2. 添加上游 qddns feed
              echo "src-git qddns ${FEED_URL};${FEED_BRANCH}" >> feeds.conf
              ./scripts/feeds update qddns
              ./scripts/feeds install -a -p qddns

              # 3. 生成默认配置
              make defconfig

              # 4. 编译 qddns 后端（Rust）和 luci-app-qddns 前端
              make package/qddns/compile -j"$(nproc)" V=sc
              make package/luci-app-qddns/compile -j"$(nproc)" V=sc

              # 5. 拷贝产物到 /output
              find bin \( -name "*.ipk" -o -name "*.apk" \) -print0 | while IFS= read -r -d "" f; do
                cp -v "$f" /output/
              done
            '

      - name: List artifacts
        run: ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qddns-${{ matrix.format }}-${{ matrix.target }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print build status
        run: |
          echo "## Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Overall build result: \`${{ needs.build.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download IPK / APK artifacts from the workflow run page (Artifacts section)." >> $GITHUB_STEP_SUMMARY
