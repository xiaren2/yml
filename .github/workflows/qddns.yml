name: Build qddns (IPK + APK)

# 触发方式：
#   1. 手动触发 (workflow_dispatch)，可选自定义目标架构
#   2. push 到 main / master
#   3. 每周一北京时间上午 10:30 自动构建
#
# 说明：
#   - 本仓库不需要 fork 上游源码，直接通过 OpenWrt feeds 引用
#     https://github.com/qimaoww/luci-app-qddns.git
#   - IPK 走 OpenWrt 23.05 SDK（旧 .ipk 包格式）
#   - APK 走 OpenWrt SNAPSHOT SDK（新 .apk 包格式，24.10+ / snapshot 默认）
#   - 直接从 downloads.openwrt.org 拉取官方 SDK tarball（不依赖 Docker Hub 镜像）

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets (target-subtarget form, space separated). e.g. "x86-64 armsr-armv8 ramips-mt7621 bcm27xx-bcm2711"'
        required: false
        default: 'x86-64'
      ipk_sdk_tag:
        description: 'OpenWrt release tag for IPK (.ipk)'
        required: false
        default: '23.05.5'
      apk_sdk_tag:
        description: 'OpenWrt release tag for APK (.apk). Use "snapshot" or "24.10.x"'
        required: false
        default: 'snapshot'
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * 1'

env:
  QDDNS_FEED_URL: https://github.com/qimaoww/luci-app-qddns.git
  QDDNS_FEED_BRANCH: main

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
      ipk_sdk_tag: ${{ steps.set.outputs.ipk_sdk_tag }}
      apk_sdk_tag: ${{ steps.set.outputs.apk_sdk_tag }}
    steps:
      - id: set
        run: |
          INPUT="${{ github.event.inputs.targets || 'x86-64' }}"
          TARGETS=$(echo "$INPUT" | tr ' ' '\n' | jq -R . | jq -sc .)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "ipk_sdk_tag=${{ github.event.inputs.ipk_sdk_tag || '23.05.5' }}" >> "$GITHUB_OUTPUT"
          echo "apk_sdk_tag=${{ github.event.inputs.apk_sdk_tag || 'snapshot' }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.format }} / ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
        format: [ipk, apk]
        include:
          - format: ipk
            sdk_tag_from: ipk_sdk_tag
          - format: apk
            sdk_tag_from: apk_sdk_tag
    steps:
      - name: Resolve parameters & validate target URL
        id: param
        run: |
          set -eo pipefail
          case "${{ matrix.sdk_tag_from }}" in
            ipk_sdk_tag) SDK_TAG="${{ needs.prepare.outputs.ipk_sdk_tag }}" ;;
            apk_sdk_tag) SDK_TAG="${{ needs.prepare.outputs.apk_sdk_tag }}" ;;
          esac
          TARGET="${{ matrix.target }}"

          # target-subtarget → target/subtarget 目录（downloads.openwrt.org 的目录结构）
          # 常见：x86-64          → targets/x86/64/
          #       armsr-armv8     → targets/armsr/armv8/
          #       ramips-mt7621   → targets/ramips/mt7621/
          #       bcm27xx-bcm2711 → targets/bcm27xx/bcm2711/
          # （把第一个 `-` 拆成 target 和 subtarget，对绝大多数 target 正确）
          DIR_TARGET="${TARGET%%-*}"
          DIR_SUBTARGET="${TARGET#*-}"

          if [ "$SDK_TAG" = "snapshot" ]; then
            RELEASE_BASE="https://downloads.openwrt.org/snapshots"
            PKG_EXT="apk"
          else
            RELEASE_BASE="https://downloads.openwrt.org/releases/${SDK_TAG}"
            PKG_EXT="ipk"
          fi
          BASE_URL="${RELEASE_BASE}/targets/${DIR_TARGET}/${DIR_SUBTARGET}"
          SHA_URL="${BASE_URL}/sha256sums"

          # 先 HEAD 探测 URL 是否存在，避免出现 404 时输出不清晰
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$SHA_URL" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            {
              echo "::error::Target ${{ matrix.target }} not found for SDK tag=${SDK_TAG} (HTTP ${HTTP_CODE} at ${SHA_URL})."
              echo ""
              echo "Hint: OpenWrt 23.05+ 已经把 armvirt 重命名为 armsr (armvirt-64 → armsr-armv8)。"
              echo "      Common 64-bit targets: x86-64, armsr-armv8, rockchip-armv8, mediatek-filogic, bcm27xx-bcm2711, ipq807x-generic."
              echo ""
              echo "Available targets on downloads.openwrt.org for tag=${SDK_TAG}:"
              TGT_LIST_URL="${RELEASE_BASE}/targets/"
              TARGETS=$(curl -fsSL "$TGT_LIST_URL" 2>/dev/null \
                | grep -oE 'href="[A-Za-z0-9_-]+/"' \
                | sed -e 's/^href="//' -e 's|"/$||' \
                | sort -u)
              for t in $TARGETS; do
                SUBTGT_URL="${RELEASE_BASE}/targets/${t}/"
                SUBS=$(curl -fsSL "$SUBTGT_URL" 2>/dev/null \
                  | grep -oE 'href="[A-Za-z0-9_.-]+/"' \
                  | sed -e 's/^href="//' -e 's|"/$||' \
                  | sort -u)
                for s in $SUBS; do
                  echo "  ${t}-${s}"
                done
              done
            } > /tmp/errmsg.txt 2>&1
            cat /tmp/errmsg.txt
            exit 1
          fi

          echo "sdk_tag=$SDK_TAG"         >> "$GITHUB_OUTPUT"
          echo "release_base=$RELEASE_BASE" >> "$GITHUB_OUTPUT"
          echo "dir_target=$DIR_TARGET"    >> "$GITHUB_OUTPUT"
          echo "dir_subtarget=$DIR_SUBTARGET" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL"       >> "$GITHUB_OUTPUT"
          echo "pkg_ext=$PKG_EXT"         >> "$GITHUB_OUTPUT"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-distutils \
            rsync subversion swig unzip wget xsltproc zstd xz-utils

      - name: Discover SDK filename (handles varying GCC versions / compression)
        id: sdk
        run: |
          set -ex
          SHA_URL="${{ steps.param.outputs.base_url }}/sha256sums"
          SUMS=$(curl -fsSL "$SHA_URL")
          # sha256sums 里每行格式: <hash>  *<filename>  或  <hash>  <filename>
          SDK_FILE=$(echo "$SUMS" \
            | grep -E 'openwrt-sdk-.*\.Linux-x86_64\.tar\.[a-z0-9]+' \
            | awk '{print $2}' \
            | sed 's/^\*//' \
            | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Could not find SDK tarball in $SHA_URL"
            exit 1
          fi
          SDK_SHA=$(echo "$SUMS" | grep "openwrt-sdk-" | awk '{print $1}' | head -n1)
          echo "file=$SDK_FILE" >> "$GITHUB_OUTPUT"
          echo "url=${{ steps.param.outputs.base_url }}/${SDK_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha=$SDK_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache SDK dl directory
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: sdk-dl-${{ matrix.target }}-${{ matrix.format }}-${{ steps.sdk.outputs.sha }}
          restore-keys: |
            sdk-dl-${{ matrix.target }}-${{ matrix.format }}-

      - name: Cache cargo registry / git index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ matrix.format }}-${{ steps.sdk.outputs.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-${{ matrix.format }}-

      - name: Download & unpack SDK
        run: |
          set -ex
          mkdir -p sdk/dl
          cd sdk
          curl -fSL --retry 3 -o sdk.tar "${{ steps.sdk.outputs.url }}"
          case "${{ steps.sdk.outputs.file }}" in
            *.tar.zst) zstd -d --rm -c sdk.tar | tar xf - ;;
            *.tar.xz)  xz -d -c sdk.tar | tar xf - ;;
            *.tar.gz)  tar xzf sdk.tar ;;
            *)         echo "unknown ext" ; exit 1 ;;
          esac
          rm -f sdk.tar
          # rename the versioned dirname → sdk/
          DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" -print | head -n1)
          mv "$DIR" openwrt-sdk
          # 预 dl 缓存映射到 SDK/dl
          rm -rf openwrt-sdk/dl
          ln -s "$PWD/dl" openwrt-sdk/dl

      - name: Build qddns packages inside SDK
        run: |
          set -ex
          cd sdk/openwrt-sdk
          export HOME="$HOME"

          # 让 rust 编译时用的 cargo 缓存指向外面的 ~/.cargo
          # SDK 的 rust-package.mk 会将 CARGO_HOME 指向 dl/ 或 ~/.cargo? 具体看情况
          # 显式设置更稳
          export CARGO_HOME="$HOME/.cargo"
          mkdir -p "$CARGO_HOME"

          # 1. 更新并安装默认 feeds（luci-base / packages/lang/rust 等）
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. 添加上游 qddns feed（不 fork 上游仓库，直接引用）
          echo "src-git qddns ${QDDNS_FEED_URL};${QDDNS_FEED_BRANCH}" >> feeds.conf
          ./scripts/feeds update qddns
          ./scripts/feeds install -a -p qddns

          # 3. 生成默认配置，确保 qddns 与 luci-app-qddns 两个包被编入
          make defconfig

          # 4. 编译 qddns 后端（Rust）和 luci-app-qddns 前端
          make package/qddns/compile -j"$(nproc)" V=sc
          make package/luci-app-qddns/compile -j"$(nproc)" V=sc

          # 5. 拷贝产物
          mkdir -p "$GITHUB_WORKSPACE/output"
          find bin -name "*.${{ steps.param.outputs.pkg_ext }}" -print0 | \
            while IFS= read -r -d "" f; do
              cp -v "$f" "$GITHUB_WORKSPACE/output/"
            done

      - name: List artifacts
        run: ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qddns-${{ matrix.format }}-${{ matrix.target }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print build status
        run: |
          echo "## Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Overall build result: \`${{ needs.build.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download IPK / APK artifacts from the workflow run page (Artifacts section)." >> $GITHUB_STEP_SUMMARY
