name: Build luci-app-ap-modem Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest          # 想最省心可改 ubuntu-24.04（GNU coreutils + 旧 gcc）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "qualcommax-ipq60xx-snapshot"
            sdk_url: "https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq60xx/openwrt-sdk-qualcommax-ipq60xx_gcc-15.3.0_musl.Linux-x86_64.tar.zst"
            extract_cmd: "tar -I zstd -xf"
          - name: "mediatek-filogic-24.10.0"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.0/targets/mediatek/filogic/openwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            extract_cmd: "tar -I zstd -xf"

    name: Build luci-app-ap-modem (${{ matrix.name }})

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache fastjar file g++ gawk gettext git libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync unzip wget zlib1g-dev xz-utils zstd

      - name: Download OpenWrt SDK
        run: |
          wget ${{ matrix.sdk_url }} -O sdk-archive
          ${{ matrix.extract_cmd }} sdk-archive
          SDK_DIR=$(tar -tf sdk-archive | head -1 | cut -f1 -d"/")
          mv "$SDK_DIR" openwrt-sdk

      # 修复1：旧版 SDK prereq 只认 GNU install，让它也接受 uutils（Ubuntu 26.04+）
      - name: Patch prereq to accept uutils coreutils
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("openwrt-sdk/include/prereq-build.mk")
          s = p.read_text()
          s = re.sub(r"install --version \| grep GNU,",
                     "install --version | grep 'GNU\\|uutils',", s)
          p.write_text(s)
          print("patched prereq-build.mk")
          PY

      # 修复2：Ubuntu 26.04 的 gcc 默认 C23，旧 luci 的 K&R 声明会冲突；
      #        放一个 cc 包装器，给主机端编译统一加 -std=gnu17
      - name: Wrap host cc with -std=gnu17 (C23 workaround)
        run: |
          mkdir -p /tmp/ccwrap
          printf '#!/bin/sh\nexec /usr/bin/cc -std=gnu17 "$@"\n' > /tmp/ccwrap/cc
          chmod +x /tmp/ccwrap/cc
          /tmp/ccwrap/cc --version | head -1

      - name: Prepare package (from kiddin9/op-packages)
        run: |
          mkdir -p openwrt-sdk/package/luci-app-ap-modem
          git clone --depth=1 https://github.com/kiddin9/op-packages.git /tmp/op-packages
          cp -r /tmp/op-packages/luci-app-ap-modem/* openwrt-sdk/package/luci-app-ap-modem/
          rm -rf /tmp/op-packages

      # 修复3：apk 版本号里点号后必须跟数字，且版本体内不能含 '-'
      #        1.0.5-r20241208 -> 1.0.5.20241208  （最终 1.0.5.20241208-r3）
      - name: Sanitize package version for apk
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("openwrt-sdk/package/luci-app-ap-modem/Makefile")
          s = p.read_text()
          m = re.search(r'^PKG_VERSION:=\s*(.+)$', s, re.M)
          if m:
            old = m.group(1).strip()
            new = old.replace('-r', '.').replace('-', '.')
            if new != old:
              s = s[:m.start(1)] + new + s[m.end(1):]
              p.write_text(s)
              print(f"PKG_VERSION: {old} -> {new}")
          PY

      - name: Build package
        working-directory: openwrt-sdk
        run: |
          export PATH=/tmp/ccwrap:$PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-ap-modem/compile V=s

      - name: Copy packages to staging
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          find openwrt-sdk/bin/packages -type f \( \
            -name "luci-app-ap-modem*.ipk" -o \
            -name "luci-app-ap-modem*.apk" -o \
            -name "luci-i18n-ap-modem*.ipk" -o \
            -name "luci-i18n-ap-modem*.apk" \
            \) -exec cp -v {} packages-staging/${{ matrix.name }}/ \;

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-staging-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-ap-modem"
          name: "luci-app-ap-modem"
          draft: false
          prerelease: false
          files: packages-staging/${{ matrix.name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
