name: Build luci-app-ap-modem Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "qualcommax-ipq60xx-snapshot"
            # ✅ 改为 GCC 15.3.0 的 snapshot SDK
            sdk_url: "https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq60xx/openwrt-sdk-qualcommax-ipq60xx_gcc-15.3.0_musl.Linux-x86_64.tar.zst"
            extract_cmd: "tar -I zstd -xf"
          - name: "mediatek-filogic-23.05.0"
            sdk_url: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            extract_cmd: "tar -xJf"

    name: Build luci-app-ap-modem (${{ matrix.name }})

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache fastjar file g++ gawk gettext git libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync unzip wget zlib1g-dev xz-utils zstd

      - name: Download and extract OpenWrt SDK
        run: |
          wget ${{ matrix.sdk_url }} -O sdk-archive
          ${{ matrix.extract_cmd }} sdk-archive
          SDK_DIR=$(tar -tf sdk-archive | head -1 | cut -f1 -d"/")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          mv "$SDK_DIR" openwrt-sdk

      - name: Checkout luci-app-ap-modem subdirectory
        run: |
          mkdir -p openwrt-sdk/package/luci-app-ap-modem
          cd openwrt-sdk/package/luci-app-ap-modem
          git init
          git remote add origin https://github.com/kiddin9/op-packages.git
          git config core.sparseCheckout true
          echo "luci-app-ap-modem" >> .git/info/sparse-checkout
          git pull --depth 1 origin master   # 注意：有些分支叫 master，有些叫 main

      - name: Build package
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-ap-modem/compile V=s || true

      - name: Debug - List bin directory structure
        shell: bash
        run: |
          echo "=== Searching for ap-modem ipk ==="
          find openwrt-sdk/bin -type f -name "*.ipk" -o -name "*.apk" | head -30 || echo "No ipk found at all"
          echo "=== Full bin tree (first 3 levels) ==="
          find openwrt-sdk/bin -maxdepth 3 -type d | head -30

      - name: Find and copy built packages
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          # 放宽匹配规则
          find openwrt-sdk/bin -type f \( -name "*ap-modem*" -o -name "*ap_modem*" -o -name "*modem*" \) -exec cp -v {} packages-staging/${{ matrix.name }}/ \; || true
          # 如果还是没找到，把整个 packages 目录复制出来供排查
          if [ -z "$(ls -A packages-staging/${{ matrix.name }} 2>/dev/null)" ]; then
            echo "⚠️ No modem packages found! Copying entire packages dir for debugging..."
            mkdir -p packages-staging/${{ matrix.name }}/debug
            find openwrt-sdk/bin/packages -type f -name "*.ipk" -exec cp {} packages-staging/${{ matrix.name }}/debug/ \; || true
          fi

      # ✅ 改为 warn 级别，避免因没找到文件就炸掉整个 workflow
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-staging-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 3
          if-no-files-found: warn   # 改为 warn，不要 error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-ap-modem-${{ matrix.name }}"
          name: "luci-app-ap-modem - ${{ matrix.name }}"
          draft: false
          prerelease: false
          files: packages-staging/${{ matrix.name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
