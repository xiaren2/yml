name: Build luci-app-ap-modem Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "qualcommax-ipq60xx-snapshot"
            sdk_url: "https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq60xx/openwrt-sdk-qualcommax-ipq60xx_gcc-15.3.0_musl.Linux-x86_64.tar.zst"
            extract_cmd: "tar -I zstd -xf"
          - name: "mediatek-filogic-23.05.0"
            sdk_url: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            extract_cmd: "tar -xJf"

    name: Build luci-app-ap-modem (${{ matrix.name }})

    steps:
      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache fastjar file g++ gawk gettext git libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync unzip wget zlib1g-dev xz-utils zstd

      - name: Download and extract OpenWrt SDK
        run: |
          wget ${{ matrix.sdk_url }} -O sdk-archive
          # 先检查文件完整性
          file sdk-archive
          ls -lh sdk-archive
          # 直接解压到目标目录，避免管道问题
          mkdir -p openwrt-sdk
          ${{ matrix.extract_cmd }} sdk-archive -C openwrt-sdk --strip-components=1
          echo "SDK extracted successfully"
          ls -la openwrt-sdk/

      - name: Checkout luci-app-ap-modem from kiddin9/op-packages
        run: |
          mkdir -p openwrt-sdk/package/luci-app-ap-modem
          cd openwrt-sdk/package/luci-app-ap-modem
          git init
          git remote add origin https://github.com/kiddin9/op-packages.git
          git config core.sparseCheckout true
          echo "luci-app-ap-modem" > .git/info/sparse-checkout
          # ✅ 关键修复：kiddin9/op-packages 的主分支是 main，不是 master
          git pull --depth 1 origin main

      - name: Build package
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-ap-modem/compile V=s || true

      - name: Debug - List all built packages
        shell: bash
        run: |
          echo "=== Searching for any ipk/apk files ==="
          find openwrt-sdk/bin -type f \( -name "*.ipk" -o -name "*.apk" \) 2>/dev/null | head -50 || echo "No packages found"
          echo ""
          echo "=== Bin directory structure ==="
          find openwrt-sdk/bin -maxdepth 4 -type d 2>/dev/null | head -30

      - name: Find and copy ap-modem packages
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          
          # 多种可能的命名模式
          PATTERNS=(
            "*ap-modem*"
            "*ap_modem*"
            "*modem*"
            "*luci-app-ap*"
            "*luci-app-modem*"
          )
          
          FOUND=false
          for pattern in "${PATTERNS[@]}"; do
            results=$(find openwrt-sdk/bin -type f -name "$pattern" 2>/dev/null)
            if [ -n "$results" ]; then
              echo "$results" | while read -r file; do
                cp -v "$file" packages-staging/${{ matrix.name }}/
                FOUND=true
              done
            fi
          done
          
          # 如果没找到特定包，复制所有包用于调试
          if [ ! "$(ls -A packages-staging/${{ matrix.name }} 2>/dev/null)" ]; then
            echo "⚠️ No ap-modem packages found! Copying ALL ipk for debugging..."
            find openwrt-sdk/bin -type f -name "*.ipk" -exec cp -v {} packages-staging/${{ matrix.name }}/ \; 2>/dev/null || true
          fi
          
          echo "=== Files in staging ==="
          ls -la packages-staging/${{ matrix.name }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-staging-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-ap-modem-${{ matrix.name }}"
          name: "luci-app-ap-modem - ${{ matrix.name }}"
          draft: false
          prerelease: false
          files: packages-staging/${{ matrix.name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
